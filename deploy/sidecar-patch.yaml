# Generated by `mage k8sManifests` from internal/k8s; do not edit.
# Adds the iormesh tracer as a sidecar (decisions #13, #14): the prepare
# patch, the tracer container, and one PID namespace for the pod so the
# tracer sees the app's processes by the pod's own pids. Set the args to
# the app's target first:
#   kubectl patch deployment <name> --patch-file deploy/sidecar-patch.yaml
# The tracer container alone runs as SELinux type spc_t (container_t is
# denied BPF on an enforcing node) at level s0, so the pod's files it
# relabels stay open to the app containers, which keep their own label.
# If the pod pins its MCS level (pod securityContext.seLinuxOptions.level,
# e.g. s0:c123,c456), set the tracer's level below to that same pair to
# keep those files at the pod's own pair (iormeshctl deploy -selinux-level
# does this for a debug tracer; docs/decisions.md #13).
spec:
  template:
    spec:
      hostUsers: true
      shareProcessNamespace: true
      containers:
        - args:
            - run
            - -listen-port
            - "8080"
            - -duration
            - 168h
            - -disk-limit
            - "0"
            - -disk-max-bytes
            - 1536MiB
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
