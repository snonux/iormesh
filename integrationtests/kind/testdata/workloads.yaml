# M7 acceptance workloads (task yb4), a text/template: {{"{{"}}.NS{{"}}"}} the
# test's namespace, {{"{{"}}.Workload{{"}}"}} the workload image (JRE and
# workload.jar), {{"{{"}}.TraefikIP{{"}}"}} Traefik's ClusterIP,
# {{"{{"}}.PodLevel{{"}}"}} the MCS level every pod pins (empty: none, the
# runtime picks a pair; task 7h4 pins the tracer's pair). Every app
# container sleeps; the test runs the scenarios with kubectl exec once a
# tracer is attached. The prepare and sidecar patches are applied on top
# by the test, from internal/k8s, as an operator would.
apiVersion: v1
kind: Namespace
metadata:
  name: {{.NS}}
---
# tcp-nat's server and client, the client dialing the Service's ClusterIP
# (kube-proxy DNATs 880 to the pod's 80); both traced by debug containers.
apiVersion: apps/v1
kind: Deployment
metadata: {name: server, namespace: {{.NS}}}
spec:
  replicas: 1
  selector: {matchLabels: {app: server}}
  template:
    metadata: {labels: {app: server}}
    spec:
      terminationGracePeriodSeconds: 5
{{- with $.PodLevel}}
      securityContext: {seLinuxOptions: {level: "{{.}}"}}
{{- end}}
      containers:
        - {name: app, image: {{.Workload}}, command: [sleep, infinity]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: {{.NS}}}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      terminationGracePeriodSeconds: 5
{{- with $.PodLevel}}
      securityContext: {seLinuxOptions: {level: "{{.}}"}}
{{- end}}
      containers:
        - {name: app, image: {{.Workload}}, command: [sleep, infinity]}
---
apiVersion: v1
kind: Service
metadata: {name: server, namespace: {{.NS}}}
spec:
  selector: {app: server}
  ports: [{port: 880, targetPort: 80}]
{{- if .Full}}
---
# The hairpin: tcp-nat's two roles in one pod, the client dialing the
# pod's own Service.
apiVersion: apps/v1
kind: Deployment
metadata: {name: hairpin, namespace: {{.NS}}}
spec:
  replicas: 1
  selector: {matchLabels: {app: hairpin}}
  template:
    metadata: {labels: {app: hairpin}}
    spec:
      terminationGracePeriodSeconds: 5
{{- with $.PodLevel}}
      securityContext: {seLinuxOptions: {level: "{{.}}"}}
{{- end}}
      containers:
        - {name: app, image: {{.Workload}}, command: [sleep, infinity]}
---
apiVersion: v1
kind: Service
metadata: {name: hairpin, namespace: {{.NS}}}
spec:
  selector: {app: hairpin}
  ports: [{port: 880, targetPort: 80}]
---
# The ingress scenario's backend (traced by a sidecar) and gateway (a
# debug container). The gateway resolves the FQDN to Traefik's ClusterIP
# through hostAliases, as a real FQDN resolves to the ingress's load
# balancer. The gateway's app container sees neither the tracer's agent
# jar nor its spool: the tracer stages both inside the JVM's root
# (decision #14, task cf4).
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: {{.NS}}}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      terminationGracePeriodSeconds: 5
{{- with $.PodLevel}}
      securityContext: {seLinuxOptions: {level: "{{.}}"}}
{{- end}}
      containers:
        - {name: app, image: {{.Workload}}, command: [sleep, infinity], ports: [{containerPort: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: inventory, namespace: {{.NS}}}
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: {{.NS}}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      terminationGracePeriodSeconds: 5
{{- with $.PodLevel}}
      securityContext: {seLinuxOptions: {level: "{{.}}"}}
{{- end}}
      hostAliases:
        - {ip: "{{.TraefikIP}}", hostnames: [shop.iormesh.test]}
      containers:
        - {name: app, image: {{.Workload}}, command: [sleep, infinity]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: {{.NS}}}
spec:
  ingressClassName: traefik
  rules:
    - host: shop.iormesh.test
      http:
        paths:
          - path: /inventory
            pathType: Prefix
            backend: {service: {name: inventory, port: {number: 80}}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: stock, namespace: {{.NS}}}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`stock.iormesh.test`)
      kind: Rule
      services: [{name: inventory, port: 80}]
---
# routes discover as a list-only identity (the RBAC the discovery needs).
apiVersion: v1
kind: ServiceAccount
metadata: {name: iormesh-routes, namespace: {{.NS}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: iormesh-routes, namespace: {{.NS}}}
rules:
  - {apiGroups: [""], resources: [services, pods], verbs: [list]}
  - {apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [list]}
  - {apiGroups: [apps], resources: [replicasets], verbs: [list]}
  - {apiGroups: [networking.k8s.io], resources: [ingresses], verbs: [list]}
  - {apiGroups: [traefik.io, traefik.containo.us], resources: [ingressroutes], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: iormesh-routes, namespace: {{.NS}}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: iormesh-routes}
subjects: [{kind: ServiceAccount, name: iormesh-routes, namespace: {{.NS}}}]
{{- end}}
