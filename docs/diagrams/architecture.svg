<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="t d">
  <title id="t">How iormesh works</title>
  <desc id="d">Two servers each run a tracer made of eBPF probes and a correlator, optionally fed by a Java agent. The controller collects trace segments over SSH and merges them into one graph.</desc>
  <defs><marker id="a22d3ee" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker><marker id="afb7185" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><marker id="afbbf24" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker><marker id="a9fb0d0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0d0"/></marker></defs>
  <rect width="1000" height="680" rx="18" fill="#0b1026"/>
  <text x="40" y="46" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" fill="#e6edf7" text-anchor="start" font-weight="600">How iormesh works</text>
  <text x="40" y="70" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#9fb0d0" text-anchor="start">Tracers on the servers write trace segments. Everything cross-host happens on the controller.</text>
  <rect x="40" y="96" width="440" height="336" rx="14" fill="#131a3d" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="56" y="120" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb0d0" text-anchor="start" font-weight="600">SERVER A</text>
  <rect x="60" y="134" width="400" height="104" rx="10" fill="#1b2454" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="76" y="160" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf7" text-anchor="start" font-weight="600">target process (JVM)</text>
  <text x="76" y="180" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">application threads</text>
  <rect x="250" y="150" width="194" height="72" rx="10" fill="#131a3d" stroke="#fb7185" stroke-width="1.5"/>
  <text x="262" y="174" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">Java agent</text>
  <text x="262" y="192" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">hooks at JDK I/O boundaries</text>
  <text x="262" y="208" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">one stack per I/O op</text>
  <path d="M390 222 L390 338" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#afb7185)"/>
  <text x="400" y="278" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#fb7185" text-anchor="start">spool</text>
  <text x="400" y="293" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#fb7185" text-anchor="start">(no socket)</text>
  <rect x="60" y="262" width="270" height="56" rx="10" fill="#1b2454" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="76" y="286" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">Linux kernel · eBPF probes</text>
  <text x="76" y="304" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">syscalls · socket state · JDK uprobes</text>
  <rect x="60" y="340" width="400" height="76" rx="10" fill="#1b2454" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="364" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">iormesh tracer (correlator)</text>
  <text x="76" y="383" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">joins fd ↔ path ↔ socket ↔ Java stack</text>
  <text x="76" y="402" font-family="'JetBrains Mono','Noto Sans Mono',Menlo,Consolas,monospace" font-size="11" fill="#9fb0d0" text-anchor="start">traces/&lt;project&gt;/ready/*.parquet · 1 per minute</text>
  <path d="M150 238 L150 260" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="160" y="254" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">syscalls</text>
  <path d="M150 318 L150 338" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="160" y="333" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">ring buffer</text>
  <path d="M100 434 L100 486" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="110" y="465" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#22d3ee" text-anchor="start">segments (rsync)</text>
  <path d="M270 486 L270 434" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#afb7185)"/>
  <text x="280" y="465" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#fb7185" text-anchor="start">deploy · start · stop (SSH)</text>
  <rect x="520" y="96" width="440" height="336" rx="14" fill="#131a3d" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="536" y="120" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb0d0" text-anchor="start" font-weight="600">SERVER B</text>
  <rect x="540" y="134" width="400" height="104" rx="10" fill="#1b2454" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="556" y="160" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf7" text-anchor="start" font-weight="600">peer process</text>
  <text x="556" y="180" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">application threads</text>
  <text x="742" y="180" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">not a JVM: no agent,</text>
  <text x="742" y="196" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">events marked unattributed</text>
  <rect x="540" y="262" width="270" height="56" rx="10" fill="#1b2454" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="556" y="286" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">Linux kernel · eBPF probes</text>
  <text x="556" y="304" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">syscalls · socket state · JDK uprobes</text>
  <rect x="540" y="340" width="400" height="76" rx="10" fill="#1b2454" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="556" y="364" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">iormesh tracer (correlator)</text>
  <text x="556" y="383" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">joins fd ↔ path ↔ socket ↔ Java stack</text>
  <text x="556" y="402" font-family="'JetBrains Mono','Noto Sans Mono',Menlo,Consolas,monospace" font-size="11" fill="#9fb0d0" text-anchor="start">traces/&lt;project&gt;/ready/*.parquet · 1 per minute</text>
  <path d="M630 238 L630 260" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="640" y="254" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">syscalls</text>
  <path d="M630 318 L630 338" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="640" y="333" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">ring buffer</text>
  <path d="M580 434 L580 486" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="590" y="465" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#22d3ee" text-anchor="start">segments (rsync)</text>
  <path d="M750 486 L750 434" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#afb7185)"/>
  <text x="760" y="465" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#fb7185" text-anchor="start">deploy · start · stop (SSH)</text>
  <path d="M462 200 L538 200" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#afbbf24)"/>
  <text x="500" y="190" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="600">TCP</text>
  <rect x="40" y="488" width="920" height="164" rx="14" fill="#131a3d" stroke="#3a4a86" stroke-width="1.5"/>
  <text x="56" y="512" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#9fb0d0" text-anchor="start" font-weight="600">CONTROLLER (YOUR LAPTOP) · iormeshctl</text>
  <rect x="60" y="526" width="200" height="78" rx="10" fill="#1b2454" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="74" y="550" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">collect</text>
  <text x="74" y="570" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">rsync the ready/ segments,</text>
  <text x="74" y="586" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">delete after transfer</text>
  <rect x="280" y="526" width="200" height="78" rx="10" fill="#1b2454" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="294" y="550" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">build</text>
  <text x="294" y="570" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">fuse both halves of a</text>
  <text x="294" y="586" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">connection into one edge</text>
  <path d="M261 565 L278 565" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <rect x="500" y="526" width="200" height="78" rx="10" fill="#1b2454" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="514" y="550" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">graph + service db</text>
  <text x="514" y="570" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">who talks to whom,</text>
  <text x="514" y="586" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">with named services</text>
  <path d="M481 565 L498 565" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <rect x="720" y="526" width="200" height="78" rx="10" fill="#1b2454" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="734" y="550" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf7" text-anchor="start" font-weight="600">views + query</text>
  <text x="734" y="570" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">SVG · sequence diagram ·</text>
  <text x="734" y="586" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">slices for humans and LLMs</text>
  <path d="M701 565 L718 565" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a22d3ee)"/>
  <text x="56" y="634" font-family="'Inter','Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" fill="#9fb0d0" text-anchor="start">The only way in is the operator&#x27;s SSH key — tracers listen on nothing and connect to nothing.</text>
</svg>
